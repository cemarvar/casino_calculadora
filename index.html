<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta europea</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;800&display=swap">
  <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>
  <main>
    <h1>Ruleta europea</h1>

    <section class="top">
      <canvas id="wheel" width="460" height="460"></canvas>
      <div class="info">
        <div class="card">Saldo: <span class="big" id="bal"></span><br>Apostado: <span id="tot"></span></div>
        <div class="card" id="msg">Elige una ficha y toca el tapete.</div>
        <div class="card">Últimos números<div class="hist" id="hist"></div></div>
      </div>
    </section>

    <section class="felt"><div class="board" id="board"></div></section>

    <div class="bar">
      <button class="chip-btn on" data-value="5">5</button>
      <button class="chip-btn" data-value="25">25</button>
      <button class="chip-btn" data-value="100">100</button>
      <button id="clear">Borrar apuestas</button>
      <button id="spin">Girar</button>
    </div>
  </main>
  <script src="./JS/script.js"></script>
</body>
</html>
